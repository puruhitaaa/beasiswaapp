name: beasiswaapp

networks:
  beasiswa_internal_net:
    driver: bridge

services:
  # 1. Edge: API Gateway (Single Public Entry - Port 3000)
  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    init: true
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      LOG_LEVEL: info
      CORS_ORIGIN: http://localhost:3001
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-default-secret-key-min-32-chars-fallback}
      INTERNAL_CLUSTER_SECRET: ${INTERNAL_CLUSTER_SECRET:-cluster-shared-secret-key}
      UPSTREAM_RBAC_URL: http://service-rbac:3001
      UPSTREAM_MASTER_URL: http://service-master:3002
      UPSTREAM_TRANSAKSI_URL: http://service-transaksi:3003
      UPSTREAM_DOKUMEN_URL: http://service-dokumen:3004
    depends_on:
      service-rbac:
        condition: service_healthy
      service-master:
        condition: service_healthy
      service-transaksi:
        condition: service_healthy
      service-dokumen:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - beasiswa_internal_net
    restart: unless-stopped

  # 2. Frontend Web Application (Port 3001)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SERVER_URL: http://localhost:3000
    init: true
    ports:
      - "3001:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - beasiswa_internal_net
    restart: unless-stopped

  # 3. Service RBAC & Identity Provider (Internal Port 3001)
  service-rbac:
    build:
      context: .
      dockerfile: apps/service-rbac/Dockerfile
    init: true
    expose:
      - "3001"
    environment:
      PORT: 3001
      DATABASE_URL: mysql://user:${MYSQL_PASSWORD:-password}@mysql:3306/rbac_db
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-default-secret-key-min-32-chars-fallback}
      BETTER_AUTH_URL: http://localhost:3000/api/auth
      CORS_ORIGIN: http://localhost:3001
      INTERNAL_CLUSTER_SECRET: ${INTERNAL_CLUSTER_SECRET:-cluster-shared-secret-key}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - beasiswa_internal_net
    restart: unless-stopped

  # 4. Service Data Master (Internal Port 3002)
  service-master:
    build:
      context: .
      dockerfile: apps/service-master/Dockerfile
    init: true
    expose:
      - "3002"
    environment:
      PORT: 3002
      DATABASE_URL: mysql://user:${MYSQL_PASSWORD:-password}@mysql:3306/master_db
      INTERNAL_CLUSTER_SECRET: ${INTERNAL_CLUSTER_SECRET:-cluster-shared-secret-key}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - beasiswa_internal_net
    restart: unless-stopped

  # 5. Service Transaksi (Internal Port 3003)
  service-transaksi:
    build:
      context: .
      dockerfile: apps/service-transaksi/Dockerfile
    init: true
    expose:
      - "3003"
    environment:
      PORT: 3003
      DATABASE_URL: mysql://user:${MYSQL_PASSWORD:-password}@mysql:3306/transaksi_db
      MASTER_SERVICE_URL: http://service-master:3002
      INTERNAL_CLUSTER_SECRET: ${INTERNAL_CLUSTER_SECRET:-cluster-shared-secret-key}
    depends_on:
      mysql:
        condition: service_healthy
      service-master:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3003/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - beasiswa_internal_net
    restart: unless-stopped

  # 6. Service Dokumen (Internal Port 3004)
  service-dokumen:
    build:
      context: .
      dockerfile: apps/service-dokumen/Dockerfile
    init: true
    expose:
      - "3004"
    environment:
      PORT: 3004
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/dokumen_db
      CLAMAV_MOCK: ${CLAMAV_MOCK:-true}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      STORAGE_ROOT: /storage/permohonan
      INTERNAL_CLUSTER_SECRET: ${INTERNAL_CLUSTER_SECRET:-cluster-shared-secret-key}
    volumes:
      - beasiswa_storage_data:/storage/permohonan
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3004/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - beasiswa_internal_net
    restart: unless-stopped

  # 7. Persistence: MySQL 8.4 (Multi-Database: rbac_db, master_db, transaksi_db)
  mysql:
    image: mysql:8.4
    container_name: beasiswaapp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: rbac_db
      MYSQL_USER: user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    ports:
      - "3306:3306"
    volumes:
      - beasiswa_mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - beasiswa_internal_net
    restart: unless-stopped

  # 8. Persistence: PostgreSQL 16 Alpine (dokumen_db)
  postgres:
    image: postgres:16-alpine
    container_name: beasiswaapp-postgres
    environment:
      POSTGRES_DB: dokumen_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - beasiswa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dokumen_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - beasiswa_internal_net
    restart: unless-stopped

  # 9. Security: ClamAV Antivirus Daemon (Optional full profile)
  clamav:
    image: clamav/clamav:latest
    container_name: beasiswaapp-clamav
    profiles: ["full"]
    ports:
      - "3310:3310"
    volumes:
      - beasiswa_clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - beasiswa_internal_net
    restart: unless-stopped

volumes:
  beasiswa_mysql_data:
  beasiswa_postgres_data:
  beasiswa_storage_data:
  beasiswa_clamav_data:
